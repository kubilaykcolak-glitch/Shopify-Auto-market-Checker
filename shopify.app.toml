# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "427258d58be485eaa2a43a6be570f1d9"
name = "pokeprice-sync"
application_url = "https://localhost:3001/app"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory"

[auth]
redirect_urls = [
  "https://localhost:3001/auth/callback",
  "https://localhost:3001/auth/shopify/callback",
  "https://localhost:3001/exitiframe",
  "https://example.com/auth/callback"
]

[webhooks]
api_version = "2024-01"
# Webhook subscriptions are disabled for local --use-localhost dev.
# Re-add when deploying to production with a real HTTPS URL.
# [[webhooks.subscriptions]]
# uri = "/webhooks/app-uninstalled"
# topics = [ "app/uninstalled" ]

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false
